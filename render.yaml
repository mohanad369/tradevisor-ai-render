services:
  - type: web
    name: tradevisor-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/vip2/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DB_DIR
        value: /tmp/tradevisor-db
      - key: PUBLIC_SITE_ORIGIN
        value: https://mohanad369.github.io
      - key: PUBLIC_SITE_ORIGIN_WWW
        value: https://tradevisorai369.b-cdn.net
      - key: PUBLIC_EXTRA_SITE_ORIGINS
        value: https://tradevisorai.com,https://www.tradevisorai.com
      - key: VIP2_OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
