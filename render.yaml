services:
  - type: web
    name: tradevisor-ai-render
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: tradevisor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DB_DIR
        value: /var/data
      - key: PUBLIC_SITE_ORIGIN
        value: https://tradevisor-ai-render.onrender.com
      - key: PUBLIC_SITE_ORIGIN_WWW
        value: https://tradevisor-ai-render.onrender.com
      - key: PUBLIC_EXTRA_SITE_ORIGINS
        value: https://mohanad369.github.io,https://tradevisorai369.b-cdn.net,https://tradevisorai.com,https://www.tradevisorai.com
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
