services:
  - type: web
    name: tradevisor-ai-render
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: tradevisor-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: APP_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEVELOPER_PASSWORD
        sync: false
      - key: DB_DIR
        value: /var/data
      - key: PUBLIC_SITE_ORIGIN
        value: https://tradevisortrading.com
      - key: PUBLIC_SITE_ORIGIN_WWW
        value: https://www.tradevisortrading.com
      - key: PUBLIC_EXTRA_SITE_ORIGINS
        value: https://tradevisor-ai-render.onrender.com,https://mohanad369.github.io,https://tradevisorai369.b-cdn.net,https://tradevisorai.com,https://www.tradevisorai.com
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: MASSIVE_API_BASE
        value: https://api.massive.com
      - key: MASSIVE_WS_URL
        value: wss://socket.massive.com/forex
      - key: GOLD_PRICE_OFFSET
        value: 0
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
